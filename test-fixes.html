<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Beautiful Flicker Fixes</title>
    <link rel="stylesheet" href="flask_app/static/css/style.css">
    <style>
        .test-status {
            padding: 20px;
            margin: 20px;
            border: 2px solid #ccc;
            background: #f5f5f5;
        }
        .test-status h2 {
            margin-bottom: 10px;
        }
        .test-result {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border: 1px solid #ddd;
        }
        .pass {
            color: green;
        }
        .fail {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Testing Beautiful Flicker JavaScript Fixes</h1>
        
        <div class="test-status">
            <h2>Test Results</h2>
            <div id="test-results"></div>
        </div>
        
        <!-- Include the app.js -->
        <script>
            // Mock elements to test
            const mockElements = {
                chartTitle: { value: 'Test Title' },
                fontFamily: { value: 'sans-serif' },
                titleFontSize: { value: '16' },
                axisFontSize: { value: '12' },
                legendFontSize: { value: '10' },
                legendPosition: { value: 'upper left' },
                chartFormat: { value: 'png' },
                resolutionType: { value: 'pixels' },
                chartWidthPx: { value: '1200' },
                chartHeightPx: { value: '800' },
                visualizationSection: { style: { display: 'none' } },
                chartConfigSection: { style: { display: 'none' } },
                chartDisplay: { innerHTML: '' },
                errorModal: { style: { display: 'none' } },
                errorMessage: { textContent: '' },
                closeError: {},
                manualFrequency: { value: '100' },
                manualModulation: { value: '5' },
                manualLabel: { value: 'Test Point' },
                manualColor: { value: '#ff0000' },
                manualPointsList: { style: { display: 'none' } },
                manualPointsContainer: { innerHTML: '' }
            };
            
            // Override document.getElementById for testing
            const originalGetElementById = document.getElementById;
            document.getElementById = function(id) {
                // Return mock elements for our app elements
                const mockMap = {
                    'chart-title': mockElements.chartTitle,
                    'font-family': mockElements.fontFamily,
                    'title-font-size': mockElements.titleFontSize,
                    'axis-font-size': mockElements.axisFontSize,
                    'legend-font-size': mockElements.legendFontSize,
                    'legend-position': mockElements.legendPosition,
                    'chart-format': mockElements.chartFormat,
                    'resolution-type': mockElements.resolutionType,
                    'chart-width-px': mockElements.chartWidthPx,
                    'chart-height-px': mockElements.chartHeightPx,
                    'visualizationSection': mockElements.visualizationSection,
                    'chartConfigSection': mockElements.chartConfigSection,
                    'chartDisplay': mockElements.chartDisplay,
                    'errorModal': mockElements.errorModal,
                    'errorMessage': mockElements.errorMessage,
                    'closeError': mockElements.closeError,
                    'manual-frequency': mockElements.manualFrequency,
                    'manual-modulation': mockElements.manualModulation,
                    'manual-label': mockElements.manualLabel,
                    'manual-color': mockElements.manualColor,
                    'manual-points-list': mockElements.manualPointsList,
                    'manual-points-container': mockElements.manualPointsContainer,
                    'addedPointsSection': { style: { display: 'none' } },
                    'addedPointsList': { innerHTML: '' }
                };
                
                if (mockMap[id]) {
                    return mockMap[id];
                }
                
                // For test results div, use real getElementById
                if (id === 'test-results') {
                    return originalGetElementById.call(document, id);
                }
                
                return null;
            };
            
            // Mock querySelectorAll
            document.querySelectorAll = function(selector) {
                if (selector === '.input-tab') {
                    return [];
                }
                if (selector === '.input-content') {
                    return [];
                }
                if (selector === '.chart-type-btn') {
                    return [{
                        classList: {
                            remove: () => {},
                            add: () => {}
                        },
                        dataset: { chartType: 'ieee' }
                    }];
                }
                return [];
            };
            
            // Mock querySelector
            document.querySelector = function(selector) {
                if (selector === '.chart-type-btn[data-chart-type="ieee"]') {
                    return {
                        classList: {
                            add: () => {}
                        }
                    };
                }
                return null;
            };
            
            // Test results
            const results = [];
            
            function addTestResult(test, passed, message) {
                results.push({
                    test: test,
                    passed: passed,
                    message: message
                });
            }
            
            // Test 1: Check if app.js loads without errors
            try {
                const script = document.createElement('script');
                script.src = 'flask_app/static/js/app.js';
                script.onload = function() {
                    addTestResult('App.js Load', true, 'Script loaded successfully');
                    runTests();
                };
                script.onerror = function() {
                    addTestResult('App.js Load', false, 'Failed to load script');
                    displayResults();
                };
                document.head.appendChild(script);
            } catch (e) {
                addTestResult('App.js Load', false, e.message);
                displayResults();
            }
            
            function runTests() {
                // Test 2: Check if appState is initialized
                try {
                    if (typeof appState !== 'undefined') {
                        addTestResult('AppState Initialization', true, 'appState is defined');
                        
                        // Test 3: Check default values
                        if (appState.currentChartType === 'ieee') {
                            addTestResult('Default Chart Type', true, 'Default chart type is IEEE 1789');
                        } else {
                            addTestResult('Default Chart Type', false, `Default is ${appState.currentChartType}, expected ieee`);
                        }
                        
                        if (appState.chartSettings.resolution_type === 'pixels') {
                            addTestResult('Default Resolution Type', true, 'Default resolution type is pixels');
                        } else {
                            addTestResult('Default Resolution Type', false, `Default is ${appState.chartSettings.resolution_type}, expected pixels`);
                        }
                        
                        if (appState.chartSettings.font === 'sans-serif') {
                            addTestResult('Default Font', true, 'Default font is sans-serif');
                        } else {
                            addTestResult('Default Font', false, `Default is ${appState.chartSettings.font}, expected sans-serif`);
                        }
                    } else {
                        addTestResult('AppState Initialization', false, 'appState is undefined');
                    }
                } catch (e) {
                    addTestResult('AppState Tests', false, e.message);
                }
                
                // Test 4: Check if functions exist
                try {
                    if (typeof updateChart === 'function') {
                        addTestResult('updateChart Function', true, 'updateChart function exists');
                    } else {
                        addTestResult('updateChart Function', false, 'updateChart function not found');
                    }
                    
                    if (typeof handleAddManualPoint === 'function') {
                        addTestResult('handleAddManualPoint Function', true, 'handleAddManualPoint function exists');
                    } else {
                        addTestResult('handleAddManualPoint Function', false, 'handleAddManualPoint function not found');
                    }
                    
                    if (typeof showError === 'function') {
                        addTestResult('showError Function', true, 'showError function exists');
                        
                        // Test error handling
                        try {
                            showError('Test error message');
                            addTestResult('Error Handling', true, 'showError executed without crash');
                        } catch (e) {
                            addTestResult('Error Handling', false, `showError crashed: ${e.message}`);
                        }
                    } else {
                        addTestResult('showError Function', false, 'showError function not found');
                    }
                } catch (e) {
                    addTestResult('Function Tests', false, e.message);
                }
                
                // Test 5: Test manual point validation
                try {
                    if (typeof handleAddManualPoint === 'function') {
                        // Mock the showError function to capture calls
                        let errorShown = false;
                        let errorMessage = '';
                        window.showError = function(msg) {
                            errorShown = true;
                            errorMessage = msg;
                        };
                        
                        // Test with valid values
                        mockElements.manualFrequency.value = '1000';
                        mockElements.manualModulation.value = '10';
                        const initialPointsLength = appState.manualPoints.length;
                        
                        // This should work
                        handleAddManualPoint();
                        
                        if (appState.manualPoints.length > initialPointsLength) {
                            addTestResult('Manual Point Addition', true, 'Manual point added successfully');
                        } else {
                            addTestResult('Manual Point Addition', false, 'Manual point was not added');
                        }
                        
                        // Test frequency validation (should accept up to 100000)
                        mockElements.manualFrequency.value = '100000';
                        mockElements.manualModulation.value = '10';
                        errorShown = false;
                        handleAddManualPoint();
                        
                        if (!errorShown) {
                            addTestResult('Frequency Max Validation', true, 'Accepts frequency up to 100000 Hz');
                        } else {
                            addTestResult('Frequency Max Validation', false, `Rejected valid frequency: ${errorMessage}`);
                        }
                        
                        // Test invalid frequency
                        mockElements.manualFrequency.value = '100001';
                        mockElements.manualModulation.value = '10';
                        errorShown = false;
                        handleAddManualPoint();
                        
                        if (errorShown && errorMessage.includes('100000')) {
                            addTestResult('Frequency Validation Message', true, 'Shows correct frequency range');
                        } else {
                            addTestResult('Frequency Validation Message', false, `Wrong message: ${errorMessage}`);
                        }
                    }
                } catch (e) {
                    addTestResult('Manual Point Tests', false, e.message);
                }
                
                displayResults();
            }
            
            function displayResults() {
                const resultsDiv = originalGetElementById.call(document, 'test-results');
                if (resultsDiv) {
                    let html = '';
                    let passed = 0;
                    let failed = 0;
                    
                    results.forEach(result => {
                        const status = result.passed ? 'pass' : 'fail';
                        if (result.passed) passed++;
                        else failed++;
                        
                        html += `<div class="test-result">
                            <span class="${status}">${result.passed ? '✓' : '✗'}</span>
                            <strong>${result.test}:</strong> ${result.message}
                        </div>`;
                    });
                    
                    html = `<div style="margin-bottom: 20px;">
                        <strong>Total Tests: ${results.length}</strong><br>
                        <span class="pass">Passed: ${passed}</span><br>
                        <span class="fail">Failed: ${failed}</span>
                    </div>` + html;
                    
                    resultsDiv.innerHTML = html;
                }
            }
            
            // Show initial status
            window.addEventListener('DOMContentLoaded', () => {
                const resultsDiv = originalGetElementById.call(document, 'test-results');
                if (resultsDiv) {
                    resultsDiv.innerHTML = '<p>Loading tests...</p>';
                }
            });
        </script>
    </div>
</body>
</html>
